name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Achar a pasta do projeto
        run: |
          P=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "PROJ=$P" >> $GITHUB_ENV
          echo "Projeto em: $P"
      - run: npm install
        working-directory: ${{ env.PROJ }}
      - run: npx cap add android
        working-directory: ${{ env.PROJ }}
      - name: Permissoes e tela deitada
        working-directory: ${{ env.PROJ }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="landscape"#' $M
      - run: npx cap sync android
        working-directory: ${{ env.PROJ }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ env.PROJ }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: QuestOS-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
